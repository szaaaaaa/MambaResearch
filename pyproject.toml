[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.2.0"
description = "Research workbench for Codex App skills and MCP tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "mcp==1.27.0",
    "pypdfium2>=4.30.0",
    "Pillow>=9.1.0",
    "requests>=2.31.0",
    "uvicorn>=0.30.0",
]
