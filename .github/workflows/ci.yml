name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e . --no-deps
          pip install pytest pyyaml requests pydantic fastapi websocket-client httpx uvicorn claude-agent-sdk pywinpty

      - name: Backend Tests
        run: pytest -q tests -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
