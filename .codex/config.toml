# Project-level Codex CLI configuration for ResearchAgent（Task 5d）。
#
# Codex CLI 在 cwd=<project_root> 下启动时会叠加 ``~/.codex/config.toml`` +
# 本地 ``.codex/config.toml``（项目级覆盖），两者合并生效。这里挂载
# ResearchAgent 自己的 MCP bridge server，让 Codex 主 agent 能调到我们的 skill
# 库（``clarify_intent`` / ``plan_research`` / ``search_papers`` / ...）。
#
# 对偶关系：``configs/agent.yaml`` 里的 ``mcp.servers.*`` 是 Claude 侧通过
# ``ClaudeAgentOptions.mcp_servers`` 注入给 SDK 子进程的配置；这里是 Codex 侧
# 通过 CLI config 文件注入给 ``codex app-server`` 的配置。同一份 MCP bridge
# 脚本两条路径都能消费，保证 skill 能力在两个 CLI 之间一致。
#
# 详见 plan 决策：docs/plans/2026-04-23-multi-model-subagent.md Task 5d。

[mcp_servers.research_agent]
command = "python"
args = [
  "-m",
  "src.mcp_bridge.server",
]

# Stage 2 — 文件分类索引 server。
# 暴露 scan / classify_one / list / set_user_override / stats 五个工具；
# 通过 ``MAMBA_ACTIVE_PROJECT_PATH`` env 定位 active project（每次 tools/call
# 都重新读，支持运行时切 project）。Claude Code 侧由
# ``src/server/workspace/mcp_server.py:default_mcp_config`` 注入到 SDK；
# Codex 这里直接走项目级 config——cwd=<repo_root> 启动时自动加载。
[mcp_servers.mamba_workspace]
command = "python"
args = [
  "-m",
  "src.server.workspace.mcp_server",
]

# Stage 4 Task 1c — Zotero Web API integration server。
# 暴露 search / list_collections / get_item / add_tag / upload_pdf 五个工具；
# 凭据走 ``ZOTERO_USER_ID`` + ``ZOTERO_API_KEY`` env / 仓库根 .env，
# 缺失时 tool 直接返回 ``isError: true`` + 引导。
# Codex CLI 在 cwd=<repo_root> 启动时自动加载本段。
[mcp_servers.mamba_zotero]
command = "python"
args = [
  "-m",
  "src.server.integrations.zotero.mcp_server",
]

# Stage 4 Task 2 — Colab URL 生成 server。
# 暴露 url_for（本地 .ipynb → drive_id 反查 / fallback URL）+ url_for_github
# （github 路径直接拼）两个工具。无凭据需求。
[mcp_servers.mamba_colab]
command = "python"
args = [
  "-m",
  "src.server.integrations.colab.mcp_server",
]
