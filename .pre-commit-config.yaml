# Pre-commit hooks for ResearchAgent.
#
# Install once per-clone with `pip install pre-commit && pre-commit install`.
# Cross-platform (Linux / macOS / Windows). If pre-commit is not installed,
# hooks silently skip — no error — so optional adoption is fine.
#
# sync-subagents：当 .claude/agents/*.md 被改动时自动重跑 scripts/sync_subagents.py
# 把 .codex/agents/*.toml 同步到相同版本。两份文件应一起进同一个 commit。

repos:
  - repo: local
    hooks:
      - id: sync-subagents
        name: sync .claude/agents → .codex/agents
        description: Regenerate .codex/agents/*.toml from .claude/agents/*.md sources
        entry: python scripts/sync_subagents.py --quiet
        language: system
        files: ^\.claude/agents/.*\.md$
        pass_filenames: false
