id: review_artifact
name: Review Artifact
version: 1.0.0
applicable_roles:
  - reviewer
description: Check task completion and claims against original evidence before scoring the target artifact.
input_contract:
  required: []
  optional:
    - SourceSet
    - ExperimentPlan
    - ResearchReport
    - ReviewVerdict
    - PaperNotes
    - EvidenceMap
    - ExperimentResults
    - ExperimentAnalysis
    - ClarifiedIntent
    - ClarificationResponse
output_artifacts:
  - ReviewVerdict
allowed_tools:
  - mcp.llm.chat
permissions: {}
timeout_sec: 180
