id: run_experiment
name: Run Experiment
version: 2.0.0
applicable_roles:
  - experimenter
description: >-
  Delegate an experiment goal to Claude Code CLI; persist workspace +
  results.json and emit ExperimentResults.
input_contract:
  required:
    - ExperimentPlan
  optional: []
output_artifacts:
  - ExperimentResults
allowed_tools: []
permissions:
  sandbox_exec: true
timeout_sec: 600
